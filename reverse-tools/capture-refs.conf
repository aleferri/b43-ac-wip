# The runs the [capture-ref: ...] markers in src/ are generated from.
#
# One run per line:  flow:board:capture[:VAR=val ...]
#
# The capture path is relative to the repo root, and may name a file inside an
# archive with the `archive.zip!inner.txt` syntax. It is written into the
# markers verbatim, so it has to be a path that still resolves: this file is
# what makes a regeneration reproducible, and what makes a capture that has
# been replaced show up as a diff in every marker instead of silently ageing.
#
# Keep this list SHORT. Every run here adds a marker line to every function it
# reaches, and a function reached by six runs carries six lines of them. One
# canonical run per condition is the point; add a second only when it says
# something the first cannot -- a cold segment and a hot one do, two cold
# segments on neighbouring channels do not.
#
# Order matters only for readability: the markers come out in the order the
# runs are listed here.

# Cold: a first bring-up, module reloaded, every trace class armed. This is the
# reference segment of test/gates.sh and the one the driver was transcribed
# from.
full:d6220:router-data/d6220/cold-sweep.zip!cold01-ch36-bw20.txt:AC_CHANNEL=36:AC_BW=20:AC_MAC_WIDTH=1:AC_FIRST_INIT=1

# Hot: a cycle on an interface already up, below 5250 MHz. Every predicate that
# tells a first bring-up from a later one is invisible in the cold sweep, so a
# function whose marker only ever names a cold capture has never been checked
# against the other condition.
up:d6220:router-data/d6220/hot-sweep.zip!segmenti/01-up-ch36-bw20.txt:AC_CHANNEL=36:AC_BW=20:AC_FIRST_INIT=0

# NOT here, and the reason is worth keeping:
#
#   rxiq_est_debug   reaches tx_tone, stopplayback and rxiq_apply_gain -- the
#                    only flow that does -- but it does not reproduce a
#                    capture: 155 of its 245 ops align, and its top-level
#                    function comes out spanning the whole segment. A marker
#                    like that claims a correspondence that is not there,
#                    which is worse than no marker.
#
# So those functions carry no marker, and that is the true state: no run
# reproduces them against a capture yet.
